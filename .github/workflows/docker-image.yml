name: Docker Image CI

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/docker-image.yml
      - Dockerfile.zh-CN
      - languages/en_CA.json
      - languages/zh.json
      - tools/auditChineseLanguage.mjs
      - tools/buildChineseLanguage.mjs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/shinobi-zh-cn

jobs:
  build:
    name: Build and publish public amd64 image to GHCR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Simplified Chinese language pack
        run: node tools/auditChineseLanguage.mjs

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.zh-CN
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Inspect published image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
